name: WakaTime Stats Update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README WakaTime block
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION_NAME: waka
          BLOCKS: "░▒▓█"
          CODE_LANG: "txt"
          COMMIT_MESSAGE: "chore: update WakaTime stats"
          LOCALE: "en"
          SHOW_TIME: "True"
          SHOW_TOTAL: "True"
          SHOW_PROJECTS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE_PER_LINE: "False"
          SHOW_LINES_OF_CODE: "True"
          SHOW_LOC_CHART: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_COMMIT: "False"
          TIME_RANGE: "last_7_days"
