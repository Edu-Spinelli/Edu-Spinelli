name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Edu-Spinelli
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%239D4EDD&color_dots=%230a0a0a,%232d0a4f,%235a1f8c,%239d4edd,%23c77dff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%239D4EDD

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
