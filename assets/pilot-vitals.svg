<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <pattern id="hexv" x="0" y="0" width="40" height="46.18" patternUnits="userSpaceOnUse">
      <polygon points="20,0.5 39.5,11.55 39.5,34.63 20,45.68 0.5,34.63 0.5,11.55" fill="none" stroke="#2d1450" stroke-width="0.5"/>
    </pattern>

    <filter id="vGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Mask for ECG draw-on effect -->
    <linearGradient id="ecgFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0"/>
      <stop offset="20%" stop-color="#9d4edd" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#c77dff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="#0a0a0a"/>
  <rect width="900" height="200" fill="url(#hexv)"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="30" fill="#1a0a2e"/>
  <line x1="0" y1="30" x2="900" y2="30" stroke="#9d4edd" stroke-width="1"/>
  <text x="18" y="20" fill="#9d4edd" font-size="12" font-weight="bold" letter-spacing="2">PILOT VITALS // BIOMETRIC FEED // ENTRY PLUG TELEMETRY</text>
  <circle cx="852" cy="14" r="4" fill="#00ff66" filter="url(#vGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="864" y="18" fill="#00ff66" font-size="11" font-weight="bold">SYNC</text>

  <!-- ============ ECG WAVE (main, left) ============ -->
  <g transform="translate(20, 50)">
    <rect width="560" height="120" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>

    <!-- Grid -->
    <g stroke="#2d1450" stroke-width="0.5">
      <line x1="0" y1="30" x2="560" y2="30"/>
      <line x1="0" y1="60" x2="560" y2="60"/>
      <line x1="0" y1="90" x2="560" y2="90"/>
      <line x1="140" y1="0" x2="140" y2="120"/>
      <line x1="280" y1="0" x2="280" y2="120"/>
      <line x1="420" y1="0" x2="420" y2="120"/>
    </g>

    <text x="6" y="14" fill="#9d4edd" font-size="10">ECG</text>

    <!-- Static base waveform (faint trail) -->
    <path d="M 0,60 L 50,60 L 60,60 L 65,50 L 70,70 L 75,20 L 80,100 L 85,55 L 90,60 L 140,60 L 150,60 L 155,50 L 160,70 L 165,20 L 170,100 L 175,55 L 180,60 L 230,60 L 240,60 L 245,50 L 250,70 L 255,20 L 260,100 L 265,55 L 270,60 L 320,60 L 330,60 L 335,50 L 340,70 L 345,20 L 350,100 L 355,55 L 360,60 L 410,60 L 420,60 L 425,50 L 430,70 L 435,20 L 440,100 L 445,55 L 450,60 L 500,60 L 510,60 L 515,50 L 520,70 L 525,20 L 530,100 L 535,55 L 540,60 L 560,60"
          fill="none" stroke="#3d1860" stroke-width="1"/>

    <!-- Live waveform with sweeping reveal -->
    <path d="M 0,60 L 50,60 L 60,60 L 65,50 L 70,70 L 75,20 L 80,100 L 85,55 L 90,60 L 140,60 L 150,60 L 155,50 L 160,70 L 165,20 L 170,100 L 175,55 L 180,60 L 230,60 L 240,60 L 245,50 L 250,70 L 255,20 L 260,100 L 265,55 L 270,60 L 320,60 L 330,60 L 335,50 L 340,70 L 345,20 L 350,100 L 355,55 L 360,60 L 410,60 L 420,60 L 425,50 L 430,70 L 435,20 L 440,100 L 445,55 L 450,60 L 500,60 L 510,60 L 515,50 L 520,70 L 525,20 L 530,100 L 535,55 L 540,60 L 560,60"
          fill="none" stroke="#c77dff" stroke-width="1.6" filter="url(#vGlow)"
          stroke-dasharray="1200"
          stroke-dashoffset="1200">
      <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="2.4s" repeatCount="indefinite"/>
    </path>

    <!-- Moving cursor dot -->
    <circle r="3.5" fill="#ffffff" filter="url(#vGlow)">
      <animateMotion dur="2.4s" repeatCount="indefinite"
        path="M 0,60 L 50,60 L 60,60 L 65,50 L 70,70 L 75,20 L 80,100 L 85,55 L 90,60 L 140,60 L 150,60 L 155,50 L 160,70 L 165,20 L 170,100 L 175,55 L 180,60 L 230,60 L 240,60 L 245,50 L 250,70 L 255,20 L 260,100 L 265,55 L 270,60 L 320,60 L 330,60 L 335,50 L 340,70 L 345,20 L 350,100 L 355,55 L 360,60 L 410,60 L 420,60 L 425,50 L 430,70 L 435,20 L 440,100 L 445,55 L 450,60 L 500,60 L 510,60 L 515,50 L 520,70 L 525,20 L 530,100 L 535,55 L 540,60 L 560,60"/>
    </circle>

    <!-- BPM display -->
    <g transform="translate(486, 14)">
      <text fill="#666" font-size="10">BPM</text>
      <text x="32" fill="#c77dff" font-size="14" font-weight="bold">87
        <animate attributeName="opacity" values="1;0.5;1" dur="0.69s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- ============ MINI BARS (right side) ============ -->
  <g transform="translate(600, 50)">

    <!-- BRAIN WAVE -->
    <text x="0" y="12" fill="#666" font-size="11">BRAIN α</text>
    <rect x="0" y="16" width="280" height="6" fill="#1a0a2e" stroke="#9d4edd" stroke-width="0.3"/>
    <rect x="0" y="16" width="0" height="6" fill="#9d4edd">
      <animate attributeName="width" values="180;220;160;240;180" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="12" fill="#c77dff" font-size="11" text-anchor="end" font-weight="bold">9.8 Hz</text>

    <!-- HEART RATE -->
    <text x="0" y="42" fill="#666" font-size="11">HEART</text>
    <rect x="0" y="46" width="280" height="6" fill="#1a0a2e" stroke="#9d4edd" stroke-width="0.3"/>
    <rect x="0" y="46" width="0" height="6" fill="#ff006e" filter="url(#vGlow)">
      <animate attributeName="width" values="120;200;120;200;120" keyTimes="0;0.15;0.3;0.45;1" dur="0.69s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="42" fill="#ff006e" font-size="11" text-anchor="end" font-weight="bold">87 BPM</text>

    <!-- SYNC -->
    <text x="0" y="72" fill="#666" font-size="11">SYNC</text>
    <rect x="0" y="76" width="280" height="6" fill="#1a0a2e" stroke="#9d4edd" stroke-width="0.3"/>
    <rect x="0" y="76" width="0" height="6" fill="#c77dff">
      <animate attributeName="width" values="0;244;244;220;244" keyTimes="0;0.55;0.7;0.85;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="72" fill="#c77dff" font-size="11" text-anchor="end" font-weight="bold">87.3%</text>

    <!-- STRESS -->
    <text x="0" y="102" fill="#666" font-size="11">STRESS</text>
    <rect x="0" y="106" width="280" height="6" fill="#1a0a2e" stroke="#9d4edd" stroke-width="0.3"/>
    <rect x="0" y="106" width="0" height="6" fill="#ffaa00">
      <animate attributeName="width" values="60;100;40;80;60" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="102" fill="#ffaa00" font-size="11" text-anchor="end" font-weight="bold">LOW</text>
  </g>

  <!-- Bottom marquee -->
  <g transform="translate(0, 192)">
    <rect width="900" height="8" fill="#1a0a2e"/>
    <rect x="-180" width="180" height="8" fill="#9d4edd">
      <animate attributeName="x" values="-180;900" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
