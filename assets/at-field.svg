<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" preserveAspectRatio="xMidYMid meet">

  <defs>
    <radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/>
    </radialGradient>

    <filter id="hexBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="120" fill="#0a0a0a"/>

  <!-- Pulsing background glow -->
  <ellipse cx="450" cy="60" rx="300" ry="50" fill="url(#hexGlow)">
    <animate attributeName="rx" values="280;340;280" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Left label -->
  <text x="20" y="35" fill="#9d4edd" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">[ A.T. FIELD // PHASE-LOCK ENGAGED ]</text>
  <text x="20" y="80" fill="#666666" font-family="'Courier New', monospace" font-size="11">MELCHIOR-1 // BALTHASAR-2 // CASPER-3</text>

  <!-- Right label -->
  <text x="880" y="35" fill="#c77dff" font-family="'Courier New', monospace" font-size="11" text-anchor="end">BARRIER: STABLE</text>
  <text x="880" y="80" fill="#666666" font-family="'Courier New', monospace" font-size="11" text-anchor="end">INTEGRITY: 100%</text>

  <!-- 5 nested hexagons centered -->
  <g transform="translate(450, 60)">

    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5"
             fill="none" stroke="#9d4edd" stroke-width="1.5" filter="url(#hexBlur)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </polygon>

    <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5"
             fill="none" stroke="#c77dff" stroke-width="1.2">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </polygon>

    <polygon points="0,-25 21.6,-12.5 21.6,12.5 0,25 -21.6,12.5 -21.6,-12.5"
             fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </polygon>

    <polygon points="0,-14 12.1,-7 12.1,7 0,14 -12.1,7 -12.1,-7"
             fill="rgba(157,78,221,0.2)" stroke="#c77dff" stroke-width="1">
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
    </polygon>

    <circle r="3" fill="#ff006e" filter="url(#hexBlur)">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.5;3" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Smaller satellite hexagons -->
  <g transform="translate(280, 60)" opacity="0.6">
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="none" stroke="#9d4edd" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <g transform="translate(620, 60)" opacity="0.6">
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="none" stroke="#9d4edd" stroke-width="1">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <g transform="translate(180, 60)" opacity="0.4">
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="none" stroke="#c77dff" stroke-width="0.8">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <g transform="translate(720, 60)" opacity="0.4">
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="none" stroke="#c77dff" stroke-width="0.8">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
    </polygon>
  </g>

</svg>
