<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <linearGradient id="lanceG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="50%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <radialGradient id="lanceCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0"/>
    </radialGradient>

    <filter id="lGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="180" fill="#0a0a0a"/>

  <!-- Cosmic dust speckles -->
  <g fill="#c77dff">
    <circle cx="80" cy="50" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="120" r="0.5"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="40" r="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="140" r="0.6"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="145" r="0.5"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="55" r="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="125" r="0.6"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Title -->
  <text x="18" y="22" fill="#9d4edd" font-size="11" letter-spacing="2">LANCE OF LONGINUS // ANTI A.T. FIELD ARMAMENT // ORBITAL STANDBY</text>
  <text x="886" y="22" fill="#c77dff" font-size="11" text-anchor="end">RANGE: ∞</text>

  <!-- Halo / energy field around the lance -->
  <ellipse cx="450" cy="100" rx="220" ry="40" fill="url(#lanceCore)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="200;240;200" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- The lance — slowly rotating, double-helix bifurcated tip -->
  <g transform="translate(450, 100)" filter="url(#lGlow)">
    <animateTransform attributeName="transform" type="rotate" from="-8 0 0" to="8 0 0" dur="6s" repeatCount="indefinite" additive="sum"/>

    <!-- Main shaft -->
    <rect x="-200" y="-3" width="400" height="6" fill="url(#lanceG)"/>

    <!-- Center pommel -->
    <circle r="6" fill="#ffffff"/>
    <circle r="10" fill="none" stroke="#c77dff" stroke-width="1">
      <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Left tip (bifurcated) - two prongs that curve outward -->
    <path d="M -200,-3 Q -240,-20 -260,-12 L -255,-6 Q -240,-12 -210,-1 Z" fill="url(#lanceG)"/>
    <path d="M -200,3 Q -240,20 -260,12 L -255,6 Q -240,12 -210,1 Z" fill="url(#lanceG)"/>

    <!-- Right tip (bifurcated) - mirror -->
    <path d="M 200,-3 Q 240,-20 260,-12 L 255,-6 Q 240,-12 210,-1 Z" fill="url(#lanceG)"/>
    <path d="M 200,3 Q 240,20 260,12 L 255,6 Q 240,12 210,1 Z" fill="url(#lanceG)"/>

    <!-- Inner helix detail (suggestion of double-helix structure) -->
    <path d="M -180,-3 Q -160,-8 -140,-3 Q -120,2 -100,-3 Q -80,-8 -60,-3 Q -40,2 -20,-3 Q 0,-8 20,-3 Q 40,2 60,-3 Q 80,-8 100,-3 Q 120,2 140,-3 Q 160,-8 180,-3" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <path d="M -180,3 Q -160,-2 -140,3 Q -120,8 -100,3 Q -80,-2 -60,3 Q -40,8 -20,3 Q 0,-2 20,3 Q 40,8 60,3 Q 80,-2 100,3 Q 120,8 140,3 Q 160,-2 180,3" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>

    <!-- Glowing tips -->
    <circle cx="-258" cy="-12" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-258" cy="12" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="258" cy="-12" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="258" cy="12" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Power readouts -->
  <g transform="translate(18, 150)" fill="#666" font-size="10">
    <text>ARMAMENT: <tspan fill="#c77dff" font-weight="bold">LANCE OF LONGINUS</tspan></text>
    <text x="240">CLASS: <tspan fill="#c77dff">N2-ABOVE</tspan></text>
    <text x="360">EFFECT: <tspan fill="#ff006e" font-weight="bold">A.T. FIELD NEUTRALIZATION</tspan></text>
    <text x="630">STATUS: <tspan fill="#00ff66" font-weight="bold">DEPLOYABLE</tspan>
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

</svg>
