<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <pattern id="hexim" x="0" y="0" width="40" height="46.18" patternUnits="userSpaceOnUse">
      <polygon points="20,0.5 39.5,11.55 39.5,34.63 20,45.68 0.5,34.63 0.5,11.55" fill="none" stroke="#2d1450" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="iBarG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>

    <filter id="iGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="#0a0a0a"/>
  <rect width="900" height="260" fill="url(#hexim)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="32" fill="#1a0a2e"/>
  <line x1="0" y1="32" x2="900" y2="32" stroke="#9d4edd" stroke-width="1"/>
  <text x="18" y="22" fill="#9d4edd" font-size="12" font-weight="bold" letter-spacing="2">[ IMPACT METRICS // PRODUCTION FIGURES // REAL NUMBERS ]</text>
  <circle cx="852" cy="16" r="4" fill="#00ff66" filter="url(#iGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="864" y="20" fill="#00ff66" font-size="11" font-weight="bold">LIVE</text>

  <!-- ============ ROW 1 ============ -->

  <!-- BIG STAT 1: Industrial Efficiency -->
  <g transform="translate(20, 50)">
    <rect width="280" height="92" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <rect x="-1" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="275" y="-1" width="6" height="6" fill="#9d4edd"/>

    <text x="14" y="20" fill="#9d4edd" font-size="10" letter-spacing="2">[ INDUSTRIAL OPTIMIZATION ]</text>

    <text x="14" y="58" fill="#c77dff" font-size="44" font-weight="bold" filter="url(#iGlow)">
      +<tspan id="m1">3.0</tspan>%
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <text x="14" y="76" fill="#ffffff" font-size="11">EFFICIENCY GAIN</text>
    <text x="14" y="88" fill="#666" font-size="10">3 BRAZILIAN MILLS // LEVENBERG-MARQUARDT</text>

    <!-- Mini bar -->
    <rect x="170" y="50" width="100" height="6" fill="#1a0a2e"/>
    <rect x="170" y="50" width="0" height="6" fill="url(#iBarG)">
      <animate attributeName="width" values="0;100;100" keyTimes="0;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- BIG STAT 2: Employees Automated -->
  <g transform="translate(310, 50)">
    <rect width="280" height="92" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <rect x="-1" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="275" y="-1" width="6" height="6" fill="#9d4edd"/>

    <text x="14" y="20" fill="#9d4edd" font-size="10" letter-spacing="2">[ AUTOMATION REACH ]</text>

    <text x="14" y="58" fill="#c77dff" font-size="44" font-weight="bold" filter="url(#iGlow)">
      45
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <text x="14" y="76" fill="#ffffff" font-size="11">EMPLOYEES SERVED</text>
    <text x="14" y="88" fill="#666" font-size="10">AI VACATION PLATFORM // n8n + LLM</text>

    <rect x="170" y="50" width="100" height="6" fill="#1a0a2e"/>
    <rect x="170" y="50" width="0" height="6" fill="url(#iBarG)">
      <animate attributeName="width" values="0;100;100" keyTimes="0;0.7;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- BIG STAT 3: PDFs Indexed -->
  <g transform="translate(600, 50)">
    <rect width="280" height="92" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <rect x="-1" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="275" y="-1" width="6" height="6" fill="#9d4edd"/>

    <text x="14" y="20" fill="#9d4edd" font-size="10" letter-spacing="2">[ DATA SCALE ]</text>

    <text x="14" y="58" fill="#c77dff" font-size="44" font-weight="bold" filter="url(#iGlow)">
      15K+
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <text x="14" y="76" fill="#ffffff" font-size="11">DOCUMENTS INDEXED</text>
    <text x="14" y="88" fill="#666" font-size="10">RAG SIMILARITY SEARCH // METAL INDUSTRY</text>

    <rect x="170" y="50" width="100" height="6" fill="#1a0a2e"/>
    <rect x="170" y="50" width="0" height="6" fill="url(#iBarG)">
      <animate attributeName="width" values="0;100;100" keyTimes="0;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============ ROW 2 ============ -->

  <g transform="translate(20, 158)">
    <rect width="210" height="88" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <text x="14" y="20" fill="#9d4edd" font-size="10" letter-spacing="2">[ PROJECTS SHIPPED ]</text>
    <text x="14" y="54" fill="#c77dff" font-size="32" font-weight="bold">
      13
      <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="14" y="72" fill="#ffffff" font-size="11">PRODUCTION SYSTEMS</text>
    <text x="14" y="82" fill="#666" font-size="10">Pentagro · SpinSoftware · IC · QuestIO</text>
  </g>

  <g transform="translate(240, 158)">
    <rect width="210" height="88" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <text x="14" y="20" fill="#9d4edd" font-size="10" letter-spacing="2">[ ARCHITECTURE LEAD ]</text>
    <text x="14" y="54" fill="#c77dff" font-size="32" font-weight="bold">
      .NET 10
      <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="14" y="72" fill="#ffffff" font-size="11">MONOLITH → MICROSERVICES</text>
    <text x="14" y="82" fill="#666" font-size="10">Vertical Slice · MediatR · RabbitMQ</text>
  </g>

  <g transform="translate(460, 158)">
    <rect width="210" height="88" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <text x="14" y="20" fill="#9d4edd" font-size="10" letter-spacing="2">[ COMPETITIVE WINS ]</text>
    <text x="14" y="54" fill="#c77dff" font-size="32" font-weight="bold">
      🥇 🥈
      <animate attributeName="opacity" values="1;0.7;1" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="14" y="72" fill="#ffffff" font-size="11">WORLDSKILLS · TRACTIAN</text>
    <text x="14" y="82" fill="#666" font-size="10">SP State Champion · 2nd Hackathon</text>
  </g>

  <g transform="translate(680, 158)">
    <rect width="200" height="88" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <text x="14" y="20" fill="#9d4edd" font-size="10" letter-spacing="2">[ CERTIFIED ]</text>
    <text x="14" y="54" fill="#c77dff" font-size="22" font-weight="bold">
      RHCSA
      <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="14" y="72" fill="#ffffff" font-size="11">+ OPENSHIFT DO180</text>
    <text x="14" y="82" fill="#666" font-size="10">Red Hat // 2025</text>
  </g>

  <!-- Bottom marquee -->
  <g transform="translate(0, 252)">
    <rect width="900" height="8" fill="#1a0a2e"/>
    <rect x="-200" width="200" height="8" fill="url(#iBarG)">
      <animate attributeName="x" values="-200;900" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
