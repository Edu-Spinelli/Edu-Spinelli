<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <pattern id="hexgrid" x="0" y="0" width="40" height="46.18" patternUnits="userSpaceOnUse">
      <polygon points="20,0.5 39.5,11.55 39.5,34.63 20,45.68 0.5,34.63 0.5,11.55"
               fill="none" stroke="#2d1450" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="380" fill="#0a0a0a"/>
  <rect width="900" height="380" fill="url(#hexgrid)"/>

  <!-- Outer frame -->
  <rect x="2" y="2" width="896" height="376" fill="none" stroke="#9d4edd" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="38" fill="#1a0a2e"/>
  <line x1="0" y1="38" x2="900" y2="38" stroke="#9d4edd" stroke-width="1"/>
  <text x="18" y="25" fill="#9d4edd" font-size="14" font-weight="bold" letter-spacing="2">
    NERV // TACTICAL OPERATIONS // EVA-03 CONSOLE
  </text>

  <!-- System time -->
  <g transform="translate(640, 25)">
    <text fill="#666" font-size="12">SYS_CLOCK</text>
    <text x="80" fill="#c77dff" font-size="13" font-weight="bold">21:47<animate attributeName="opacity" values="1;0.55;1" dur="1s" repeatCount="indefinite"/></text>
    <text x="120" fill="#666" font-size="12">// GEOFRONT</text>
  </g>

  <!-- Pulsing alert badge -->
  <circle cx="852" cy="19" r="5" fill="#ff006e" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6;5" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="864" y="23" fill="#ff006e" font-size="11" font-weight="bold" letter-spacing="1">ALERT</text>

  <!-- Vertical scanning line (across full panel) -->
  <rect x="-30" y="38" width="30" height="342" fill="url(#scanGrad)" opacity="0.7">
    <animate attributeName="x" values="-30;900" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ============ PANEL: PILOT (top-left) ============ -->
  <g transform="translate(20, 58)">
    <rect width="420" height="140" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <rect x="-1" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="-1" y="133" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="133" width="8" height="8" fill="#9d4edd"/>

    <text x="12" y="22" fill="#9d4edd" font-size="11" letter-spacing="2">[ PILOT_FILE ]</text>

    <text x="12" y="50" fill="#666" font-size="13">NAME</text>
    <text x="80" y="50" fill="#ffffff" font-size="13">SPINELLI, EDUARDO H.</text>

    <text x="12" y="72" fill="#666" font-size="13">UNIT</text>
    <text x="80" y="72" fill="#ffffff" font-size="13">EVA-03 // PENTAGRO</text>

    <text x="12" y="94" fill="#666" font-size="13">ROLE</text>
    <text x="80" y="94" fill="#ffffff" font-size="13">FULL STACK ENGINEER</text>

    <text x="12" y="116" fill="#666" font-size="13">BASE</text>
    <text x="80" y="116" fill="#ffffff" font-size="13">UFSCAR // SÃO CARLOS-SP</text>

    <circle cx="386" cy="48" r="4" fill="#00ff66" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="396" y="52" fill="#00ff66" font-size="11" text-anchor="end">LIVE</text>
  </g>

  <!-- ============ PANEL: SYNC RATIO (top-right) ============ -->
  <g transform="translate(460, 58)">
    <rect width="420" height="140" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <rect x="-1" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="-1" y="133" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="133" width="8" height="8" fill="#9d4edd"/>

    <text x="12" y="22" fill="#9d4edd" font-size="11" letter-spacing="2">[ SYNC_RATIO // HARMONIC ]</text>

    <text x="12" y="46" fill="#666" font-size="12">CURRENT</text>
    <rect x="12" y="54" width="396" height="20" fill="#1a0a2e" stroke="#9d4edd" stroke-width="0.5"/>
    <rect x="14" y="56" width="0" height="16" fill="url(#syncGrad)">
      <animate attributeName="width" values="0;346;346;180;346" keyTimes="0;0.55;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="402" y="68" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="end">87.3%</text>

    <text x="12" y="96" fill="#666" font-size="12">A.T. FIELD STRENGTH</text>
    <rect x="12" y="104" width="396" height="10" fill="#1a0a2e" stroke="#9d4edd" stroke-width="0.5"/>
    <rect x="14" y="106" width="0" height="6" fill="#c77dff">
      <animate attributeName="width" values="0;320;320;380;320" keyTimes="0;0.4;0.6;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="12" y="128" fill="#666" font-size="12">PEAK</text>
    <text x="60" y="128" fill="#c77dff" font-size="12" font-weight="bold">94.1%</text>
    <text x="130" y="128" fill="#666" font-size="12">DELTA</text>
    <text x="185" y="128" fill="#00ff66" font-size="12">+02.4%</text>
    <text x="260" y="128" fill="#666" font-size="12">STATE</text>
    <text x="310" y="128" fill="#c77dff" font-size="12">STABLE</text>
  </g>

  <!-- ============ PANEL: CURRENT ENGAGEMENT (bottom-left) ============ -->
  <g transform="translate(20, 218)">
    <rect width="420" height="142" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <rect x="-1" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="-1" y="135" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="135" width="8" height="8" fill="#9d4edd"/>

    <text x="12" y="22" fill="#9d4edd" font-size="11" letter-spacing="2">[ CURRENT_ENGAGEMENT ]</text>

    <text x="12" y="48" fill="#666" font-size="13">TARGET</text>
    <text x="78" y="48" fill="#ff006e" font-size="13" font-weight="bold">SACHIEL<animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/></text>
    <text x="146" y="48" fill="#666" font-size="11">// INDUSTRIAL OPT</text>

    <text x="12" y="70" fill="#666" font-size="13">VECTOR</text>
    <text x="78" y="70" fill="#ffffff" font-size="13">LEVENBERG-MARQUARDT</text>

    <text x="12" y="92" fill="#666" font-size="13">SCOPE</text>
    <text x="78" y="92" fill="#ffffff" font-size="13">3 BRAZILIAN MILLS</text>

    <text x="12" y="114" fill="#666" font-size="13">YIELD</text>
    <text x="78" y="114" fill="#00ff66" font-size="13" font-weight="bold">+3.0% EFFICIENCY</text>

    <text x="12" y="134" fill="#666" font-size="11">STATUS: TARGET ACQUIRED</text>
    <circle cx="220" cy="131" r="3" fill="#ff006e" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ PANEL: A.T. FIELD (bottom-right) ============ -->
  <g transform="translate(460, 218)">
    <rect width="420" height="142" fill="rgba(157,78,221,0.04)" stroke="#9d4edd" stroke-width="1"/>
    <rect x="-1" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="-1" width="8" height="8" fill="#9d4edd"/>
    <rect x="-1" y="135" width="8" height="8" fill="#9d4edd"/>
    <rect x="413" y="135" width="8" height="8" fill="#9d4edd"/>

    <text x="12" y="22" fill="#9d4edd" font-size="11" letter-spacing="2">[ A.T. FIELD // BARRIER ]</text>

    <!-- Animated nested hexagons -->
    <g transform="translate(85, 85)">
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="none" stroke="#9d4edd" stroke-width="2" filter="url(#glow)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="none" stroke="#c77dff" stroke-width="1.5">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10" fill="none" stroke="#ffffff" stroke-width="1">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </polygon>
      <circle r="4" fill="#ff006e" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="190" y="50" fill="#666" font-size="13">STATUS</text>
    <text x="256" y="50" fill="#00ff66" font-size="13" font-weight="bold">ACTIVE</text>

    <text x="190" y="72" fill="#666" font-size="13">INTEGRITY</text>
    <text x="280" y="72" fill="#ffffff" font-size="13">100%</text>

    <text x="190" y="94" fill="#666" font-size="13">EXPANSION</text>
    <text x="280" y="94" fill="#c77dff" font-size="13">PHASE-LOCK</text>

    <text x="190" y="116" fill="#666" font-size="13">CORE</text>
    <text x="240" y="116" fill="#ffffff" font-size="13">S2 ENGINE</text>

    <text x="190" y="134" fill="#666" font-size="11">PERIMETER: UNLIMITED</text>
  </g>

  <!-- Bottom marquee progress strip -->
  <g transform="translate(0, 372)">
    <rect x="0" y="0" width="900" height="6" fill="#1a0a2e"/>
    <rect x="-140" y="0" width="140" height="6" fill="url(#syncGrad)">
      <animate attributeName="x" values="-140;900" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-280" y="0" width="80" height="6" fill="#9d4edd" opacity="0.5">
      <animate attributeName="x" values="-280;760" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
