<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <pattern id="hexm" x="0" y="0" width="40" height="46.18" patternUnits="userSpaceOnUse">
      <polygon points="20,0.5 39.5,11.55 39.5,34.63 20,45.68 0.5,34.63 0.5,11.55" fill="none" stroke="#2d1450" stroke-width="0.5"/>
    </pattern>

    <filter id="magiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="screenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" fill="#0a0a0a"/>
  <rect width="900" height="280" fill="url(#hexm)"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="32" fill="#1a0a2e"/>
  <line x1="0" y1="32" x2="900" y2="32" stroke="#9d4edd" stroke-width="1"/>
  <text x="18" y="22" fill="#9d4edd" font-size="13" font-weight="bold" letter-spacing="2">MAGI SYSTEM // 3-WAY UNANIMITY VOTE // CASPAR PROTOCOL</text>
  <circle cx="855" cy="16" r="4" fill="#00ff66" filter="url(#magiGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="866" y="20" fill="#00ff66" font-size="10" font-weight="bold">SYNC</text>

  <!-- Inter-MAGI communication lines -->
  <g stroke="#9d4edd" stroke-width="1" fill="none">
    <line x1="160" y1="170" x2="450" y2="170" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="170" x2="740" y2="170" opacity="0.4">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="160" y1="170" x2="740" y2="170" opacity="0.2" stroke-dasharray="3 3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Data packets traveling between MAGI -->
  <circle r="3" fill="#c77dff" filter="url(#magiGlow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 160,170 L 450,170"/>
  </circle>
  <circle r="3" fill="#c77dff" filter="url(#magiGlow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 450,170 L 740,170"/>
  </circle>
  <circle r="2" fill="#9d4edd">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 740,170 L 160,170"/>
  </circle>

  <!-- ========== MELCHIOR-1 (left) ========== -->
  <g transform="translate(40, 56)">
    <rect width="240" height="180" fill="url(#screenG)" stroke="#9d4edd" stroke-width="1.5"/>
    <rect x="-1" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="235" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="-1" y="175" width="6" height="6" fill="#9d4edd"/>
    <rect x="235" y="175" width="6" height="6" fill="#9d4edd"/>

    <text x="120" y="22" fill="#9d4edd" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">MELCHIOR-1</text>
    <text x="120" y="38" fill="#666" font-size="10" text-anchor="middle">SCIENTIST PERSONA // BACKEND</text>

    <!-- Terminal lines (typewriter feel via opacity steps) -->
    <text x="12" y="60" fill="#c77dff" font-size="11">&gt; loading .NET 10 runtime</text>
    <text x="12" y="75" fill="#c77dff" font-size="11">&gt; vertical_slice.init()</text>
    <text x="12" y="90" fill="#c77dff" font-size="11">&gt; rabbitmq.connect()</text>
    <text x="12" y="105" fill="#c77dff" font-size="11">&gt; analyzing pattern...</text>
    <text x="12" y="120" fill="#ffffff" font-size="11">
      &gt; <tspan>verdict: <tspan fill="#00ff66" font-weight="bold">CONFIRM</tspan></tspan>
    </text>

    <!-- Processing bars -->
    <rect x="12" y="135" width="216" height="6" fill="#1a0a2e"/>
    <rect x="12" y="135" width="0" height="6" fill="#9d4edd">
      <animate attributeName="width" values="0;216;216" keyTimes="0;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>

    <text x="12" y="158" fill="#666" font-size="10">CPU</text>
    <text x="60" y="158" fill="#c77dff" font-size="10">87%</text>
    <text x="100" y="158" fill="#666" font-size="10">MEM</text>
    <text x="140" y="158" fill="#c77dff" font-size="10">62%</text>

    <!-- Vote LED -->
    <circle cx="218" cy="160" r="6" fill="#00ff66" filter="url(#magiGlow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="186" y="172" fill="#666" font-size="9">VOTE:</text>
    <text x="218" y="180" fill="#00ff66" font-size="9" text-anchor="middle" font-weight="bold">YES</text>
  </g>

  <!-- ========== BALTHASAR-2 (center) ========== -->
  <g transform="translate(330, 56)">
    <rect width="240" height="180" fill="url(#screenG)" stroke="#9d4edd" stroke-width="1.5"/>
    <rect x="-1" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="235" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="-1" y="175" width="6" height="6" fill="#9d4edd"/>
    <rect x="235" y="175" width="6" height="6" fill="#9d4edd"/>

    <text x="120" y="22" fill="#9d4edd" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">BALTHASAR-2</text>
    <text x="120" y="38" fill="#666" font-size="10" text-anchor="middle">MOTHER PERSONA // FRONTEND</text>

    <text x="12" y="60" fill="#c77dff" font-size="11">&gt; mounting next.js</text>
    <text x="12" y="75" fill="#c77dff" font-size="11">&gt; tailwind.compile()</text>
    <text x="12" y="90" fill="#c77dff" font-size="11">&gt; render: 60fps</text>
    <text x="12" y="105" fill="#c77dff" font-size="11">&gt; user_intent: parsed</text>
    <text x="12" y="120" fill="#ffffff" font-size="11">
      &gt; <tspan>verdict: <tspan fill="#00ff66" font-weight="bold">CONFIRM</tspan></tspan>
    </text>

    <rect x="12" y="135" width="216" height="6" fill="#1a0a2e"/>
    <rect x="12" y="135" width="0" height="6" fill="#9d4edd">
      <animate attributeName="width" values="0;216;216" keyTimes="0;0.7;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <text x="12" y="158" fill="#666" font-size="10">CPU</text>
    <text x="60" y="158" fill="#c77dff" font-size="10">74%</text>
    <text x="100" y="158" fill="#666" font-size="10">MEM</text>
    <text x="140" y="158" fill="#c77dff" font-size="10">55%</text>

    <circle cx="218" cy="160" r="6" fill="#00ff66" filter="url(#magiGlow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="186" y="172" fill="#666" font-size="9">VOTE:</text>
    <text x="218" y="180" fill="#00ff66" font-size="9" text-anchor="middle" font-weight="bold">YES</text>
  </g>

  <!-- ========== CASPER-3 (right) ========== -->
  <g transform="translate(620, 56)">
    <rect width="240" height="180" fill="url(#screenG)" stroke="#9d4edd" stroke-width="1.5"/>
    <rect x="-1" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="235" y="-1" width="6" height="6" fill="#9d4edd"/>
    <rect x="-1" y="175" width="6" height="6" fill="#9d4edd"/>
    <rect x="235" y="175" width="6" height="6" fill="#9d4edd"/>

    <text x="120" y="22" fill="#9d4edd" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">CASPER-3</text>
    <text x="120" y="38" fill="#666" font-size="10" text-anchor="middle">WOMAN PERSONA // DEVOPS</text>

    <text x="12" y="60" fill="#c77dff" font-size="11">&gt; k8s.deploy(production)</text>
    <text x="12" y="75" fill="#c77dff" font-size="11">&gt; openshift.ready</text>
    <text x="12" y="90" fill="#c77dff" font-size="11">&gt; aspire.observe()</text>
    <text x="12" y="105" fill="#c77dff" font-size="11">&gt; pipeline: green</text>
    <text x="12" y="120" fill="#ffffff" font-size="11">
      &gt; <tspan>verdict: <tspan fill="#00ff66" font-weight="bold">CONFIRM</tspan></tspan>
    </text>

    <rect x="12" y="135" width="216" height="6" fill="#1a0a2e"/>
    <rect x="12" y="135" width="0" height="6" fill="#9d4edd">
      <animate attributeName="width" values="0;216;216" keyTimes="0;0.7;1" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="12" y="158" fill="#666" font-size="10">CPU</text>
    <text x="60" y="158" fill="#c77dff" font-size="10">91%</text>
    <text x="100" y="158" fill="#666" font-size="10">MEM</text>
    <text x="140" y="158" fill="#c77dff" font-size="10">78%</text>

    <circle cx="218" cy="160" r="6" fill="#00ff66" filter="url(#magiGlow)">
      <animate attributeName="opacity" values="0.6;0.2;1;0.6" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="186" y="172" fill="#666" font-size="9">VOTE:</text>
    <text x="218" y="180" fill="#00ff66" font-size="9" text-anchor="middle" font-weight="bold">YES</text>
  </g>

  <!-- Central decision verdict -->
  <g transform="translate(450, 260)">
    <text fill="#00ff66" font-size="12" font-weight="bold" text-anchor="middle" filter="url(#magiGlow)" letter-spacing="3">
      &gt;&gt; UNANIMITY ACHIEVED // OPERATION AUTHORIZED &lt;&lt;
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

</svg>
