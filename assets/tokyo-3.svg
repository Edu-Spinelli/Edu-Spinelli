<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>

    <linearGradient id="geofrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1860" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="tGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="900" height="180" fill="url(#skyGrad)"/>
  <!-- Underground -->
  <rect y="180" width="900" height="160" fill="url(#groundGrad)"/>
  <!-- Surface line -->
  <line x1="0" y1="180" x2="900" y2="180" stroke="#9d4edd" stroke-width="1.5"/>

  <!-- Moon with halo -->
  <circle cx="780" cy="60" r="40" fill="url(#moonGrad)"/>
  <circle cx="780" cy="60" r="22" fill="#c77dff" opacity="0.85" filter="url(#tGlow)"/>

  <!-- Stars -->
  <g fill="#c77dff">
    <circle cx="80" cy="40" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="20" r="0.7"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="60" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="30" r="0.8"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="45" r="0.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="25" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="55" r="0.6"><animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="20" r="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="100" r="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Tokyo-3 skyline (buildings rising/falling above surface) -->
  <g fill="#0a0518" stroke="#9d4edd" stroke-width="1">
    <!-- B1: rising into position -->
    <rect x="60" y="120" width="40" height="60">
      <animate attributeName="height" values="0;60;60" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;120;120" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="90" width="35" height="90">
      <animate attributeName="height" values="0;90;90" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;90;90" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="175" y="105" width="30" height="75">
      <animate attributeName="height" values="0;75;75" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;105;105" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="225" y="70" width="45" height="110">
      <animate attributeName="height" values="0;110;110" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;70;70" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="100" width="35" height="80">
      <animate attributeName="height" values="0;80;80" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;100;100" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="345" y="80" width="40" height="100">
      <animate attributeName="height" values="0;100;100" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;80;80" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="405" y="110" width="30" height="70">
      <animate attributeName="height" values="0;70;70" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;110;110" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="455" y="60" width="45" height="120">
      <animate attributeName="height" values="0;120;120" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;60;60" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="520" y="95" width="35" height="85">
      <animate attributeName="height" values="0;85;85" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;95;95" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="575" y="115" width="30" height="65">
      <animate attributeName="height" values="0;65;65" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;115;115" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="625" y="85" width="40" height="95">
      <animate attributeName="height" values="0;95;95" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;85;85" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="685" y="105" width="35" height="75">
      <animate attributeName="height" values="0;75;75" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;105;105" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Building windows (lights) -->
  <g fill="#c77dff" filter="url(#tGlow)">
    <rect x="68" y="135" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="80" y="150" width="3" height="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="128" y="110" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="140" y="130" width="3" height="3"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="235" y="90" width="3" height="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="250" y="120" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="355" y="100" width="3" height="3"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="370" y="130" width="3" height="3"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="465" y="80" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="480" y="110" width="3" height="3"><animate attributeName="opacity" values="1;0.5;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="635" y="105" width="3" height="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="650" y="130" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Top labels -->
  <text x="18" y="18" fill="#9d4edd" font-size="11" letter-spacing="2">TOKYO-3 // SECTOR 7 // 21:47 GEOFRONT TIME</text>
  <text x="886" y="18" fill="#c77dff" font-size="11" text-anchor="end" font-weight="bold">SURFACE ELEV: +124m</text>

  <!-- Surface label -->
  <text x="18" y="195" fill="#666" font-size="10">+ SURFACE  // armored skyline (auto-retracting)</text>

  <!-- GEOFRONT pyramid (inverted, below ground) -->
  <g transform="translate(450, 180)">
    <polygon points="-280,0 280,0 200,140 -200,140" fill="url(#geofrontGrad)" stroke="#9d4edd" stroke-width="1.5"/>

    <!-- Internal grid lines -->
    <line x1="-240" y1="20" x2="240" y2="20" stroke="#9d4edd" stroke-width="0.4" opacity="0.5"/>
    <line x1="-220" y1="40" x2="220" y2="40" stroke="#9d4edd" stroke-width="0.4" opacity="0.5"/>
    <line x1="-200" y1="60" x2="200" y2="60" stroke="#9d4edd" stroke-width="0.4" opacity="0.5"/>
    <line x1="-180" y1="80" x2="180" y2="80" stroke="#9d4edd" stroke-width="0.4" opacity="0.5"/>
    <line x1="-160" y1="100" x2="160" y2="100" stroke="#9d4edd" stroke-width="0.4" opacity="0.5"/>

    <!-- NERV HQ pyramid (small) inside -->
    <polygon points="-30,40 30,40 18,90 -18,90" fill="#1a0a2e" stroke="#c77dff" stroke-width="1"/>
    <circle cx="0" cy="65" r="6" fill="#ff006e" filter="url(#tGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Side conduits -->
    <line x1="-200" y1="20" x2="-30" y2="50" stroke="#c77dff" stroke-width="0.6" opacity="0.6"/>
    <line x1="200" y1="20" x2="30" y2="50" stroke="#c77dff" stroke-width="0.6" opacity="0.6"/>
    <line x1="-100" y1="100" x2="-18" y2="80" stroke="#c77dff" stroke-width="0.6" opacity="0.6"/>
    <line x1="100" y1="100" x2="18" y2="80" stroke="#c77dff" stroke-width="0.6" opacity="0.6"/>

    <!-- Floating data packets -->
    <circle r="2.5" fill="#c77dff" filter="url(#tGlow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M -200,20 L -30,50 L 30,50 L 200,20 L 100,100 L -100,100 Z"/>
    </circle>
    <circle r="2" fill="#9d4edd">
      <animateMotion dur="4.2s" repeatCount="indefinite" path="M 200,20 L 30,50 L -30,50 L -200,20 L -100,100 L 100,100 Z"/>
    </circle>
  </g>

  <!-- Labels for GEOFRONT -->
  <text x="18" y="210" fill="#9d4edd" font-size="11" letter-spacing="2">GEOFRONT // -2300m // NERV HQ</text>
  <text x="450" y="328" fill="#666" font-size="10" text-anchor="middle">▼ NERV HQ // central command pyramid ▼</text>
  <text x="886" y="210" fill="#c77dff" font-size="11" text-anchor="end" font-weight="bold">DEPTH: -2300m</text>

</svg>
