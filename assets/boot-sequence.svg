<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <pattern id="hexb" x="0" y="0" width="40" height="46.18" patternUnits="userSpaceOnUse">
      <polygon points="20,0.5 39.5,11.55 39.5,34.63 20,45.68 0.5,34.63 0.5,11.55" fill="none" stroke="#2d1450" stroke-width="0.5"/>
    </pattern>

    <filter id="bGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="bootBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>

    <!-- Reveal mask: a moving rect that exposes content -->
    <clipPath id="revealText">
      <rect x="0" y="0" width="0" height="220">
        <animate attributeName="width" values="0;900;900" keyTimes="0;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="220" fill="#0a0a0a"/>
  <rect width="900" height="220" fill="url(#hexb)"/>

  <!-- Top frame -->
  <rect x="2" y="2" width="896" height="216" fill="none" stroke="#9d4edd" stroke-width="0.6" stroke-dasharray="6 3"/>

  <!-- Header -->
  <text x="18" y="22" fill="#9d4edd" font-size="11" letter-spacing="2">NERV.SYS v3.14 // BOOT SEQUENCE // GEOFRONT MAINFRAME</text>

  <!-- Blinking cursor following the text -->
  <rect x="14" y="38" width="8" height="14" fill="#c77dff" opacity="0">
    <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Boot lines (revealed sequentially via reveal mask) -->
  <g clip-path="url(#revealText)" fill="#c77dff" font-size="13">
    <text x="14" y="50">[ 0.001 ] POST: CPU x32     // CACHE: 2048KB        // MEM: 16TB</text>
    <text x="14" y="68" fill="#ffffff">[ 0.024 ] booting MAGI cluster..............................<tspan fill="#00ff66">[ OK ]</tspan></text>
    <text x="14" y="86" fill="#ffffff">[ 0.087 ] linking MELCHIOR-1 // BALTHASAR-2 // CASPER-3.....<tspan fill="#00ff66">[ OK ]</tspan></text>
    <text x="14" y="104" fill="#ffffff">[ 0.142 ] AT field generator......phase-lock engaged.......<tspan fill="#00ff66">[ OK ]</tspan></text>
    <text x="14" y="122" fill="#ffffff">[ 0.211 ] pilot biofeed.....SPINELLI, EDUARDO H..sync 87.3<tspan fill="#00ff66">[ OK ]</tspan></text>
    <text x="14" y="140" fill="#ffffff">[ 0.288 ] EVA-03 standby....cradle locked..umbilical live..<tspan fill="#00ff66">[ OK ]</tspan></text>
    <text x="14" y="158" fill="#ffffff">[ 0.341 ] angel detection grid // sector 7..................<tspan fill="#ffaa00">[ SCANNING ]</tspan></text>
    <text x="14" y="176" fill="#ff006e" font-weight="bold">[ 0.412 ] PATTERN DETECTED — BLOOD-TYPE BLUE — DEPLOY?......<tspan fill="#ff006e">[ CONFIRM ]</tspan></text>
    <text x="14" y="200" fill="#9d4edd" font-weight="bold" letter-spacing="2">&gt; SYSTEM READY // WELCOME TO NERV, EDUARDO.</text>
  </g>

  <!-- Loading bar at bottom -->
  <rect x="14" y="208" width="872" height="6" fill="#1a0a2e" stroke="#9d4edd" stroke-width="0.4"/>
  <rect x="16" y="210" width="0" height="2" fill="url(#bootBar)" filter="url(#bGlow)">
    <animate attributeName="width" values="0;868;868" keyTimes="0;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Top-right status -->
  <text x="886" y="22" fill="#c77dff" font-size="11" text-anchor="end" font-weight="bold">
    BOOT <tspan fill="#00ff66" font-weight="bold">100%
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.95" dur="6s" repeatCount="indefinite"/>
    </tspan>
  </text>

</svg>
