<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <pattern id="hexr" x="0" y="0" width="40" height="46.18" patternUnits="userSpaceOnUse">
      <polygon points="20,0.5 39.5,11.55 39.5,34.63 20,45.68 0.5,34.63 0.5,11.55" fill="none" stroke="#2d1450" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="radarG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#9d4edd" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="radarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="320" fill="#0a0a0a"/>
  <rect width="900" height="320" fill="url(#hexr)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="34" fill="#1a0a2e"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#9d4edd" stroke-width="1"/>
  <text x="18" y="22" fill="#9d4edd" font-size="13" font-weight="bold" letter-spacing="2">ANGEL DETECTION GRID // SECTOR 7 // BLOOD-TYPE BLUE PATTERN</text>
  <circle cx="852" cy="17" r="4" fill="#ff006e" filter="url(#radarGlow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <text x="864" y="21" fill="#ff006e" font-size="11" font-weight="bold">SCAN</text>

  <!-- ===================== RADAR (left side) ===================== -->
  <g transform="translate(170, 175)">

    <!-- Outer ring -->
    <circle r="125" fill="url(#radarG)" stroke="#9d4edd" stroke-width="1.5"/>

    <!-- Concentric rings -->
    <circle r="100" fill="none" stroke="#9d4edd" stroke-width="0.8" opacity="0.5"/>
    <circle r="75" fill="none" stroke="#9d4edd" stroke-width="0.8" opacity="0.5"/>
    <circle r="50" fill="none" stroke="#9d4edd" stroke-width="0.8" opacity="0.5"/>
    <circle r="25" fill="none" stroke="#9d4edd" stroke-width="0.8" opacity="0.5"/>

    <!-- Crosshair -->
    <line x1="-125" y1="0" x2="125" y2="0" stroke="#9d4edd" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="-125" x2="0" y2="125" stroke="#9d4edd" stroke-width="0.6" opacity="0.4"/>

    <!-- Compass marks -->
    <text x="0" y="-132" fill="#9d4edd" font-size="10" text-anchor="middle">N</text>
    <text x="134" y="4" fill="#9d4edd" font-size="10" text-anchor="middle">E</text>
    <text x="0" y="142" fill="#9d4edd" font-size="10" text-anchor="middle">S</text>
    <text x="-134" y="4" fill="#9d4edd" font-size="10" text-anchor="middle">W</text>

    <!-- Sweep arc (rotating cone) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <path d="M 0,0 L 125,0 A 125,125 0 0,1 88,88 Z" fill="url(#sweepG)" opacity="0.6"/>
      <line x1="0" y1="0" x2="125" y2="0" stroke="#c77dff" stroke-width="1.5" filter="url(#radarGlow)"/>
    </g>

    <!-- Angel blips (each fades in/out timed to feel like they're "spotted" by sweep) -->
    <!-- Sachiel at NE -->
    <circle cx="80" cy="-50" r="5" fill="#ff006e" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0;1;0.8;0" keyTimes="0;0.05;0.5;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="-48" fill="#ff006e" font-size="9">SACHIEL</text>

    <!-- Ramiel at E -->
    <circle cx="105" cy="20" r="5" fill="#ff006e" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0;0;1;0.8;0" keyTimes="0;0.2;0.25;0.7;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="117" y="24" fill="#ff006e" font-size="9">RAMIEL</text>

    <!-- Israfel at SE -->
    <circle cx="60" cy="75" r="5" fill="#ff006e" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0;0;1;0.8;0" keyTimes="0;0.35;0.4;0.85;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="79" fill="#ff006e" font-size="9">ISRAFEL</text>

    <!-- Sahaquiel at SW -->
    <circle cx="-70" cy="65" r="5" fill="#ff006e" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0;0;1;0.8;0" keyTimes="0;0.55;0.6;0.95;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="-118" y="69" fill="#ff006e" font-size="9">SAHAQUIEL</text>

    <!-- Leliel at W -->
    <circle cx="-95" cy="-15" r="5" fill="#ff006e" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0;0;1;0.8;0;0" keyTimes="0;0.75;0.8;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="-130" y="-13" fill="#ff006e" font-size="9">LELIEL</text>

    <!-- Bardiel at NW -->
    <circle cx="-55" cy="-80" r="5" fill="#ff006e" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0;1;0.8;0;0;0" keyTimes="0;0.05;0.15;0.2;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="-100" y="-78" fill="#ff006e" font-size="9">BARDIEL</text>

    <!-- Center marker -->
    <circle r="3" fill="#9d4edd" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- ===================== INFO PANEL (right side) ===================== -->
  <g transform="translate(360, 56)">

    <!-- Vertical divider -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#9d4edd" stroke-width="0.5" opacity="0.4"/>

    <text x="20" y="20" fill="#9d4edd" font-size="11" letter-spacing="2">[ THREAT_ASSESSMENT ]</text>

    <text x="20" y="48" fill="#666" font-size="12">DETECTED</text>
    <text x="160" y="48" fill="#c77dff" font-size="14" font-weight="bold">6</text>
    <text x="180" y="48" fill="#666" font-size="11">angels</text>

    <text x="20" y="72" fill="#666" font-size="12">NEUTRALIZED</text>
    <text x="160" y="72" fill="#00ff66" font-size="14" font-weight="bold">6</text>
    <text x="180" y="72" fill="#666" font-size="11">targets</text>

    <text x="20" y="96" fill="#666" font-size="12">PATTERN</text>
    <text x="160" y="96" fill="#ff006e" font-size="13" font-weight="bold">BLUE</text>
    <text x="200" y="96" fill="#666" font-size="11">// confirmed</text>

    <text x="20" y="120" fill="#666" font-size="12">A.T. FIELD</text>
    <text x="160" y="120" fill="#00ff66" font-size="13" font-weight="bold">ACTIVE</text>

    <text x="20" y="144" fill="#666" font-size="12">SECTOR</text>
    <text x="160" y="144" fill="#ffffff" font-size="13">7 / TOKYO-3</text>

    <!-- Mini coordinates ticker -->
    <text x="20" y="180" fill="#9d4edd" font-size="11" letter-spacing="2">[ COORDINATES ]</text>

    <text x="20" y="206" fill="#666" font-size="11">LAT  </text>
    <text x="60" y="206" fill="#c77dff" font-size="12" font-weight="bold">35.6°N
      <animate attributeName="opacity" values="1;0.6;1" dur="1.4s" repeatCount="indefinite"/>
    </text>

    <text x="20" y="226" fill="#666" font-size="11">LON  </text>
    <text x="60" y="226" fill="#c77dff" font-size="12" font-weight="bold">139.7°E
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/>
    </text>

    <text x="20" y="246" fill="#666" font-size="11">DEPTH</text>
    <text x="60" y="246" fill="#c77dff" font-size="12" font-weight="bold">-2300m
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </text>

  </g>

  <!-- ===================== KILL FEED (far right) ===================== -->
  <g transform="translate(620, 56)">
    <text x="0" y="20" fill="#9d4edd" font-size="11" letter-spacing="2">[ KILL_FEED // RECENT ]</text>

    <text x="0" y="48" fill="#666" font-size="11">[NEUTRALIZED]</text>
    <text x="100" y="48" fill="#00ff66" font-size="11" font-weight="bold">SACHIEL</text>

    <text x="0" y="68" fill="#666" font-size="11">[NEUTRALIZED]</text>
    <text x="100" y="68" fill="#00ff66" font-size="11" font-weight="bold">RAMIEL</text>

    <text x="0" y="88" fill="#666" font-size="11">[NEUTRALIZED]</text>
    <text x="100" y="88" fill="#00ff66" font-size="11" font-weight="bold">ISRAFEL</text>

    <text x="0" y="108" fill="#666" font-size="11">[NEUTRALIZED]</text>
    <text x="100" y="108" fill="#00ff66" font-size="11" font-weight="bold">SAHAQUIEL</text>

    <text x="0" y="128" fill="#666" font-size="11">[NEUTRALIZED]</text>
    <text x="100" y="128" fill="#00ff66" font-size="11" font-weight="bold">LELIEL</text>

    <text x="0" y="148" fill="#666" font-size="11">[NEUTRALIZED]</text>
    <text x="100" y="148" fill="#00ff66" font-size="11" font-weight="bold">BARDIEL</text>

    <!-- Incoming -->
    <line x1="0" y1="170" x2="240" y2="170" stroke="#9d4edd" stroke-width="0.5" opacity="0.4"/>
    <text x="0" y="190" fill="#ff006e" font-size="11" font-weight="bold">
      [INCOMING]
      <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="190" fill="#ff006e" font-size="11" font-weight="bold">UNKNOWN_07</text>

    <text x="0" y="220" fill="#666" font-size="10">ESTIMATED IMPACT</text>
    <text x="160" y="220" fill="#c77dff" font-size="10">T-MINUS 4:21</text>

    <text x="0" y="240" fill="#666" font-size="10">DEPLOY EVA-03?</text>
    <text x="120" y="240" fill="#00ff66" font-size="10" font-weight="bold">[CONFIRM]
      <animate attributeName="opacity" values="1;0.4;1" dur="0.9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom strip with marquee -->
  <g transform="translate(0, 310)">
    <rect width="900" height="10" fill="#1a0a2e"/>
    <rect x="-150" width="150" height="10" fill="#9d4edd">
      <animate attributeName="x" values="-150;900" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
