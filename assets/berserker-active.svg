<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" preserveAspectRatio="xMidYMid meet" font-family="'Courier New', ui-monospace, monospace">

  <defs>
    <pattern id="hexber" x="0" y="0" width="40" height="46.18" patternUnits="userSpaceOnUse">
      <polygon points="20,0.5 39.5,11.55 39.5,34.63 20,45.68 0.5,34.63 0.5,11.55" fill="none" stroke="#3a0011" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="rageAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rageBarG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="50%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="rGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="redShake2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#0a0006"/>
  <rect width="900" height="320" fill="url(#hexber)"/>

  <!-- Red tint pulse overlay -->
  <rect width="900" height="320" fill="#ff006e" opacity="0.05">
    <animate attributeName="opacity" values="0.02;0.12;0.02" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Title bar with screaming red -->
  <rect x="0" y="0" width="900" height="34" fill="#1a0008"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#ff006e" stroke-width="1.5"/>
  <text x="18" y="22" fill="#ff006e" font-size="13" font-weight="bold" letter-spacing="3">!!! EVA-01 BERSERKER MODE ACTIVE !!! PILOT UPLINK SEVERED !!!
    <animate attributeName="opacity" values="1;0.5;1" dur="0.5s" repeatCount="indefinite"/>
  </text>

  <!-- Pulsing red dots -->
  <circle cx="855" cy="17" r="5" fill="#ff006e" filter="url(#rGlow)">
    <animate attributeName="opacity" values="1;0.1;1" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="866" y="21" fill="#ff006e" font-size="11" font-weight="bold">RAGE</text>

  <!-- Glitch scan lines that race vertically -->
  <rect x="0" y="40" width="900" height="2" fill="#ff006e" opacity="0.4">
    <animate attributeName="y" values="40;320;40" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="40" width="900" height="1" fill="#ffffff" opacity="0.3">
    <animate attributeName="y" values="320;40" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- EVA-01 berserker silhouette (left side) -->
  <g transform="translate(160, 180)">

    <!-- Rage aura -->
    <ellipse cx="0" cy="-30" rx="100" ry="120" fill="url(#rageAura)">
      <animate attributeName="rx" values="90;120;90" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="110;130;110" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Subtle shake on whole figure -->
    <g filter="url(#redShake2)">
      <animateTransform attributeName="transform" type="translate" values="0,0;1,-1;-1,1;0,0" dur="0.15s" repeatCount="indefinite" additive="sum"/>

      <!-- Head with horn -->
      <polygon points="-14,-130 0,-145 14,-130 9,-110 -9,-110" fill="#3d1860" stroke="#9d4edd" stroke-width="1.3"/>
      <rect x="-16" y="-110" width="32" height="22" fill="#3d1860" stroke="#9d4edd" stroke-width="1.3"/>

      <!-- BERSERK RED EYES (large, glowing) -->
      <circle cx="-6" cy="-100" r="4.5" fill="#ff006e" filter="url(#rGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5;5.5;4.5" dur="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="6" cy="-100" r="4.5" fill="#ff006e" filter="url(#rGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5;5.5;4.5" dur="0.6s" repeatCount="indefinite"/>
      </circle>

      <!-- Neck -->
      <rect x="-8" y="-88" width="16" height="10" fill="#3d1860" stroke="#9d4edd" stroke-width="1"/>

      <!-- Torso -->
      <polygon points="-32,-78 32,-78 38,30 -38,30" fill="#3d1860" stroke="#9d4edd" stroke-width="1.3"/>

      <!-- BERSERK CHEST CORE — red glowing -->
      <circle cx="0" cy="-30" r="9" fill="#ff006e" filter="url(#rGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="8;11;8" dur="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-30" r="4" fill="#ffffff"/>

      <!-- Shoulders -->
      <polygon points="-38,-78 -52,-50 -34,-50" fill="#3d1860" stroke="#9d4edd" stroke-width="1"/>
      <polygon points="38,-78 52,-50 34,-50" fill="#3d1860" stroke="#9d4edd" stroke-width="1"/>

      <!-- Arms in aggressive pose (bent) -->
      <rect x="-54" y="-50" width="14" height="40" fill="#3d1860" stroke="#9d4edd" stroke-width="1" transform="rotate(-12 -47 -10)"/>
      <rect x="40" y="-50" width="14" height="40" fill="#3d1860" stroke="#9d4edd" stroke-width="1" transform="rotate(12 47 -10)"/>

      <!-- Claws (red glowing) -->
      <polygon points="-58,-10 -50,-10 -54,4" fill="#ff006e" filter="url(#rGlow)">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.7s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="50,-10 58,-10 54,4" fill="#ff006e" filter="url(#rGlow)">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.7s" repeatCount="indefinite"/>
      </polygon>

      <!-- Lower body -->
      <polygon points="-38,30 38,30 34,80 -34,80" fill="#3d1860" stroke="#9d4edd" stroke-width="1"/>

      <!-- Legs -->
      <rect x="-26" y="80" width="16" height="24" fill="#3d1860" stroke="#9d4edd" stroke-width="1"/>
      <rect x="10" y="80" width="16" height="24" fill="#3d1860" stroke="#9d4edd" stroke-width="1"/>
    </g>

    <!-- "BROKEN" umbilical (frayed at top) -->
    <line x1="0" y1="-178" x2="0" y2="-140" stroke="#9d4edd" stroke-width="2" stroke-dasharray="3 4" opacity="0.6"/>
    <line x1="0" y1="-178" x2="-6" y2="-188" stroke="#ff006e" stroke-width="1.5"/>
    <line x1="0" y1="-178" x2="6" y2="-186" stroke="#ff006e" stroke-width="1.5"/>
    <text x="20" y="-180" fill="#ff006e" font-size="10" font-weight="bold">UMBILICAL: SEVERED
      <animate attributeName="opacity" values="1;0.4;1" dur="0.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Stats panel (right side) -->
  <g transform="translate(340, 50)">

    <text x="0" y="14" fill="#ff006e" font-size="12" font-weight="bold" letter-spacing="2">[ SYSTEM ALERT // ALL READINGS ABNORMAL ]</text>

    <!-- SYNC RATIO 400% (overflow bar) -->
    <text x="0" y="42" fill="#666" font-size="12">SYNC RATIO</text>
    <text x="520" y="42" fill="#ff006e" font-size="14" font-weight="bold" text-anchor="end" filter="url(#rGlow)">400%
      <animate attributeName="opacity" values="1;0.5;1" dur="0.5s" repeatCount="indefinite"/>
    </text>
    <rect x="0" y="50" width="520" height="14" fill="#1a0008" stroke="#ff006e" stroke-width="0.5"/>
    <rect x="0" y="50" width="0" height="14" fill="url(#rageBarG)" filter="url(#rGlow)">
      <animate attributeName="width" values="0;520;520;520" keyTimes="0;0.4;0.95;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <!-- Overflow markers -->
    <text x="100" y="78" fill="#666" font-size="9">100%</text>
    <text x="230" y="78" fill="#666" font-size="9">200%</text>
    <text x="360" y="78" fill="#666" font-size="9">300%</text>
    <text x="500" y="78" fill="#ff006e" font-size="9" font-weight="bold" text-anchor="end">OFF SCALE
      <animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite"/>
    </text>

    <!-- Power source -->
    <text x="0" y="108" fill="#666" font-size="12">POWER SOURCE</text>
    <text x="160" y="108" fill="#ff006e" font-size="12" font-weight="bold">S² ENGINE</text>
    <text x="280" y="108" fill="#666" font-size="11">// internal • unlimited</text>

    <!-- Control status -->
    <text x="0" y="130" fill="#666" font-size="12">CONTROL</text>
    <text x="160" y="130" fill="#ff006e" font-size="12" font-weight="bold">AUTONOMOUS
      <animate attributeName="opacity" values="1;0.4;1" dur="0.7s" repeatCount="indefinite"/>
    </text>

    <!-- Operational time -->
    <text x="0" y="152" fill="#666" font-size="12">OP-TIME LIMIT</text>
    <text x="160" y="152" fill="#ff006e" font-size="12" font-weight="bold">UNLIMITED</text>

    <!-- Pilot status -->
    <text x="0" y="174" fill="#666" font-size="12">PILOT</text>
    <text x="160" y="174" fill="#666" font-size="12" font-style="italic">absorbed... LCL signal lost</text>

    <!-- AT field -->
    <text x="0" y="196" fill="#666" font-size="12">A.T. FIELD</text>
    <text x="160" y="196" fill="#ff006e" font-size="12" font-weight="bold">EXPANDING ∞</text>

    <!-- Bottom dramatic line -->
    <text x="0" y="234" fill="#ff006e" font-size="11" font-style="italic" letter-spacing="2">
      "It moved on its own..."
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="252" fill="#666" font-size="10">— Misato Katsuragi</text>
  </g>

  <!-- Bottom marquee -->
  <g transform="translate(0, 310)">
    <rect width="900" height="10" fill="#1a0008"/>
    <rect x="-150" width="150" height="10" fill="#ff006e">
      <animate attributeName="x" values="-150;900" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-300" width="100" height="10" fill="#7b2cbf" opacity="0.6">
      <animate attributeName="x" values="-300;800" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
